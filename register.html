<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Robotics CLub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Robotics Club</h1>
        <p>Imagine. Build. Innovate.</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>
    <main>
        <section id=" register">
<h2>Join Our Events</h2>
<p>Complete the form below to register for Robotice Club event.</p>
        <form id="register-form">
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" minlength="3" required>

            <label for="email">University Email:</label>
            <input type="email" id="email" name="email" placeholder="student@university.edu.com" required>

            <label for="phone">Phone Number:</label>
            <input type ="tel" id="phone" name="phone" placeholder="03001234567" pattern="03[0-9]{9}" required>

            <label for="event">Choose an Event:</label>
            <select id="event" name="event" required>
                <option value="">Select an event</option>
                <option value="Robotics Workshop">Robotics Workshop</option>
                <option value="Robot Programming Workshop">Robot Programming Workshop</option>
                <option value="Robotics Exhibition">Robotics Exhibition</option>
                <option value="Robotics Competition">Robotics Competition</option>
            </select>
        </form>








</section>   
    
    
    
    
    
    
    </main>

        <p>© 2026 Robotics Club. All rights reserved.</p>
        <p>Imagine. Build. Innovate.</p>
    </footer>
</body>
</html>
